name: Build SM8250 SukiSU-Ultra Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Target device codename"
        required: true
        default: "instantnoodle"
        type: choice
        options:
          - instantnoodle
          - instantnoodlep
          - kebab
          - lemonadep
      kernel_repo:
        description: "Kernel source repo URL"
        required: true
        default: "https://github.com/The-Anomalist/Singularity"
      kernel_branch:
        description: "Branch (EvoX  -Devices: bka=A16; LineageOS: lineage-23.0=A16, lineage-22.2=A15)"
        required: true
        default: "Evolved"
      enable_susfs:
        description: "Enable SUSFS (root hiding)"
        required: true
        default: true
        type: boolean
      enable_lto:
        description: "Enable LTO (slower build, smaller/faster kernel)"
        required: false
        default: false
        type: boolean

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build ${{ inputs.device }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4
        with:
          path: build

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git libelf-dev \
            libssl-dev lz4 zip zstd python3 python3-pip device-tree-compiler \
            curl wget rsync unzip gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: kernel-${{ inputs.device }}
          max-size: 4G

      - name: Clone kernel source
        run: |
          REPO="${{ inputs.kernel_repo }}"
          BRANCH="${{ inputs.kernel_branch }}"
          echo "Cloning $REPO @ $BRANCH"
          if ! git clone --depth=1 -b "$BRANCH" "$REPO" kernel; then
            echo "::error::Failed to clone $REPO at branch '$BRANCH'."
            echo "Available branches on remote:"
            git ls-remote --heads "$REPO" | awk '{print "  " $2}' | sed 's|refs/heads/||'
            exit 128
          fi
          echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV

      - name: Clone AOSP clang toolchain
        run: |
          mkdir -p toolchain/clang
          git clone --depth=1 -b master-kernel-build-2023 \
            https://gitlab.com/PixelOS-Devices/playgroundtc.git toolchain/clang || \
          git clone --depth=1 \
            https://gitlab.com/LeCmnGend/clang.git toolchain/clang
          echo "CLANG_DIR=$GITHUB_WORKSPACE/toolchain/clang" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s susfs-main
          if ! grep -q "drivers/kernelsu" drivers/Makefile 2>/dev/null; then
            echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          fi
          if ! grep -q "kernelsu/Kconfig" drivers/Kconfig 2>/dev/null; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

      - name: Apply SUSFS patches
        if: ${{ inputs.enable_susfs }}
        working-directory: kernel
        run: |
          git clone --depth=1 -b kernel-4.19 \
            https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          cp ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || true
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true

          if [ -f ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch ]; then
            patch -p1 --forward --fuzz=3 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.19.patch || true
          fi

          if [ -f ../build/patches/susfs_sukisu_hooks.patch ]; then
            patch -p1 --forward --fuzz=3 < ../build/patches/susfs_sukisu_hooks.patch || true
          fi

      - name: Apply project patches
        working-directory: kernel
        run: |
          shopt -s nullglob
          for p in ../build/patches/*.patch; do
            [ "$(basename "$p")" = "susfs_sukisu_hooks.patch" ] && continue
            echo "Applying $p"
            patch -p1 --forward --fuzz=3 < "$p" || true
          done

      - name: Configure defconfig
        working-directory: kernel
        run: |
          DEVICE="${{ inputs.device }}"
          CFG_DIR="arch/arm64/configs"

          echo "=== Available defconfigs ==="
          find "$CFG_DIR" -maxdepth 2 -name "*_defconfig" -o -name "*.config" | sort
          echo "==========================="

          CANDIDATES=(
            "vendor/${DEVICE}_defconfig"
            "vendor/lineage_${DEVICE}_defconfig"
            "vendor/lineage-${DEVICE}_defconfig"
            "vendor/kona-perf_defconfig"
            "vendor/kona_defconfig"
            "vendor/lineage_kona_defconfig"
            "vendor/lineageos_${DEVICE}_defconfig"
          )

          DEFCONFIG=""
          for cfg in "${CANDIDATES[@]}"; do
            if [ -f "$CFG_DIR/$cfg" ]; then
              DEFCONFIG="$cfg"
              echo "Selected: $DEFCONFIG"
              break
            fi
          done

          if [ -z "$DEFCONFIG" ]; then
            echo "::error::no defconfig matched for $DEVICE"
            exit 1
          fi

          MERGE_FRAGS=""
          for frag in \
              "$CFG_DIR/vendor/oplus.config" \
              "$CFG_DIR/vendor/debugfs.config" \
              "$CFG_DIR/vendor/lineage.config" \
              "$CFG_DIR/vendor/lineageos.config" \
              "$CFG_DIR/vendor/${DEVICE}.config"; do
            [ -f "$frag" ] && MERGE_FRAGS="$MERGE_FRAGS $frag"
          done

          cat ../build/configs/sukisu.config >> "$CFG_DIR/$DEFCONFIG"

          if [ "${{ inputs.enable_lto }}" = "true" ]; then
            cat ../build/configs/lto.config >> "$CFG_DIR/$DEFCONFIG"
          fi

          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV
          echo "MERGE_FRAGS=$MERGE_FRAGS" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: kernel
        run: |
          export PATH="$CLANG_DIR/bin:/usr/lib/ccache:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="github"
          export KBUILD_BUILD_HOST="actions"
          export LLVM=1
          export LLVM_IAS=1

          MAKE_ARGS=(
            O=out
            ARCH=arm64
            CC="ccache clang"
            LD=ld.lld
            AR=llvm-ar
            NM=llvm-nm
            OBJCOPY=llvm-objcopy
            OBJDUMP=llvm-objdump
            STRIP=llvm-strip
            CLANG_TRIPLE=aarch64-linux-gnu-
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          )

          make "${MAKE_ARGS[@]}" "$DEFCONFIG"

          if [ -n "$MERGE_FRAGS" ]; then
            echo "Merging fragments: $MERGE_FRAGS"
            ./scripts/kconfig/merge_config.sh -O out -m out/.config $MERGE_FRAGS
            make "${MAKE_ARGS[@]}" olddefconfig
          fi

          make -j"$(nproc --all)" "${MAKE_ARGS[@]}" 2>&1 | tee build.log

      - name: Verify kernel image
        working-directory: kernel
        run: |
          IMAGE=out/arch/arm64/boot/Image
          if [ ! -f "$IMAGE" ]; then
            echo "Build failed — no Image produced"
            tail -200 build.log
            exit 1
          fi
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
          cp build/anykernel/anykernel.sh ak3/anykernel.sh
          sed -i "s/__DEVICE__/${{ inputs.device }}/g" ak3/anykernel.sh

          cp kernel/out/arch/arm64/boot/Image ak3/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/Image.gz ak3/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtb.img ak3/ 2>/dev/null || true
          cp kernel/out/arch/arm64/boot/dtbo.img ak3/ 2>/dev/null || true

          STAMP=$(date +%Y%m%d-%H%M)
          ZIP_NAME="SukiSU-${{ inputs.device }}-EvoX-A16-${STAMP}.zip"
          cd ak3
          zip -r9 "../$ZIP_NAME" . -x ".git*" "*.md"
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.device }}
          path: kernel/build.log
          if-no-files-found: ignore
