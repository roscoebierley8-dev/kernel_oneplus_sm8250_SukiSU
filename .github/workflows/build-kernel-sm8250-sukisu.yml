name: Build Kernel - SM8250 - SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU-Ultra branch (main / susfs-main)'
        required: false
        default: 'main'
      enable_kpm:
        description: 'Enable KPM support'
        required: false
        default: 'true'
        type: boolean
      enable_lto:
        description: 'LTO mode (thin / none)'
        required: false
        default: 'thin'
      upload_release:
        description: 'Publish Release after build'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [ udc ]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'

env:
  KERNEL_REPO:      "Evolution-XYZ-Devices/kernel_oneplus_sm8250"
  KERNEL_BRANCH:    "udc"
  ARCH:             "arm64"
  DEFCONFIG:        "vendor/kona-perf_defconfig"
  OUT_DIR:          "out"
  KERNEL_VERSION:   "4.19"
  ANYKERNEL_REPO:   "osm0sis/AnyKernel3"
  ANYKERNEL_BRANCH: "master"

jobs:
  build:
    name: Build SM8250 Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl wget zip unzip bc bison flex libssl-dev libelf-dev python3 make gcc g++ gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu libncurses-dev cpio device-tree-compiler lld llvm

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch ${{ env.KERNEL_BRANCH }} https://github.com/${{ env.KERNEL_REPO }}.git kernel_src
          cd kernel_src
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "KERNEL_DATE=$(date '+%Y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Download Clang toolchain
        run: |
          mkdir -p toolchain/clang
          wget -q --show-progress "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240704-release/Clang-19.0.0git-20240704.tar.gz" -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang --strip-components=1
          rm clang.tar.gz
          CLANG_BIN="$(pwd)/toolchain/clang/bin"
          for tool in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ ! -f "$CLANG_BIN/$tool" ]; then
              SYS=$(which $tool 2>/dev/null || true)
              [ -n "$SYS" ] && ln -sf "$SYS" "$CLANG_BIN/$tool"
            fi
          done
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV

      - name: Integrate SukiSU-Ultra
        working-directory: kernel_src
        run: |
          BRANCH="${{ github.event.inputs.sukisu_branch }}"
          [ -z "$BRANCH" ] && BRANCH="main"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH"
          SUKI_VER=$(grep "^KERNELSU_VERSION" KernelSU/kernel/Makefile 2>/dev/null | awk '{print $3}' || echo "unknown")
          echo "SUKI_VERSION=$SUKI_VER" >> $GITHUB_ENV

      - name: Patch KPM access_ok for Linux 4.19
        working-directory: kernel_src
        run: |
          # Bug 1 修复：setup.sh 将文件集成到 drivers/kernelsu/，而非 KernelSU/kernel/
          KPM_C="drivers/kernelsu/kpm/kpm.c"
          if [ ! -f "$KPM_C" ]; then
            echo "kpm.c not found at $KPM_C, skipping patch"
            exit 0
          fi

          KERNEL_MAJOR=$(make kernelversion 2>/dev/null | cut -d. -f1 || echo "4")
          if [ "$KERNEL_MAJOR" -lt 5 ]; then
            # Bug 2 修复：arm64 4.19 底层函数是 __range_ok，不是 __access_ok
            # Bug 3 修复：通过 sed 插在 #include <linux/uaccess.h> 之后，
            #            避免后续 include 将我们的定义覆盖
            sed -i 's|#include <linux/uaccess.h>|#include <linux/uaccess.h>\n#include <linux/version.h>\n#if LINUX_VERSION_CODE < KERNEL_VERSION(5, 0, 0)\n#undef  access_ok\n#define access_ok(addr, size) __range_ok(addr, size)\n#endif|' "$KPM_C"
            echo "Patch applied successfully"
            grep -A6 "uaccess.h" "$KPM_C" | head -10
          fi

      - name: Modify defconfig
        working-directory: kernel_src
        run: |
          DEFCONFIG_FILE="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}"
          [ ! -f "$DEFCONFIG_FILE" ] && DEFCONFIG_FILE="arch/${{ env.ARCH }}/configs/kona_defconfig"
          echo "ACTUAL_DEFCONFIG=$DEFCONFIG_FILE" >> $GITHUB_ENV
          printf '\nCONFIG_KSU=y\nCONFIG_KPROBES=y\nCONFIG_HAVE_KPROBES=y\nCONFIG_KPROBE_EVENTS=y\nCONFIG_KALLSYMS=y\nCONFIG_KALLSYMS_ALL=y\nCONFIG_MODULES=y\nCONFIG_MODULE_UNLOAD=y\n' >> "$DEFCONFIG_FILE"
          [ "${{ github.event.inputs.enable_kpm }}" = "true" ] && echo "CONFIG_KPM=y" >> "$DEFCONFIG_FILE"
          tail -12 "$DEFCONFIG_FILE"

      - name: Set LTO mode
        run: |
          LTO="${{ github.event.inputs.enable_lto }}"
          [ -z "$LTO" ] && LTO="thin"
          echo "LTO_FLAG=LTO=$LTO" >> $GITHUB_ENV

      - name: Generate .config
        working-directory: kernel_src
        run: |
          DEFCONFIG_NAME=$(echo "${{ env.ACTUAL_DEFCONFIG }}" | sed 's|arch/arm64/configs/||')
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD="${{ env.CLANG_BIN }}/ld.lld" AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip "$DEFCONFIG_NAME"

      - name: Build kernel
        working-directory: kernel_src
        run: |
          START=$(date +%s)
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- LD="${{ env.CLANG_BIN }}/ld.lld" AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip ${{ env.LTO_FLAG }} -j$(nproc --all) 2>&1 | tee ../build.log
          END=$(date +%s)
          echo "BUILD_MINS=$(( (END-START)/60 ))min" >> $GITHUB_ENV
          if [ -f "${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image" ]; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV; exit 1
          fi

      - name: Package with AnyKernel3
        if: env.BUILD_SUCCESS == 'true'
        run: |
          git clone --depth=1 https://github.com/${{ env.ANYKERNEL_REPO }}.git -b ${{ env.ANYKERNEL_BRANCH }} AnyKernel3
          cp kernel_src/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image AnyKernel3/
          DTBO="kernel_src/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img"
          [ -f "$DTBO" ] && cp "$DTBO" AnyKernel3/
          KPM_TAG=""; [ "${{ github.event.inputs.enable_kpm }}" = "true" ] && KPM_TAG="-KPM"
          ZIP="Kernel-SM8250-SukiSU_v${{ env.SUKI_VERSION }}${KPM_TAG}-${{ env.KERNEL_DATE }}-${{ env.KERNEL_COMMIT }}.zip"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV
          cd AnyKernel3 && zip -r9 "../$ZIP" . -x ".git*" -x "*.md" -x "LICENSE" && cd ..
          echo "ZIP_SHA256=$(sha256sum "$ZIP" | awk '{print $1}')" >> $GITHUB_ENV
          echo "ZIP_SIZE=$(du -sh "$ZIP" | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload Artifact
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.KERNEL_DATE }}
          path: build.log
          retention-days: 3

      - name: Publish GitHub Release
        if: env.BUILD_SUCCESS == 'true' && (github.event.inputs.upload_release == 'true' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "SukiSU-${{ env.SUKI_VERSION }}-${{ env.KERNEL_DATE }}"
          name: "SM8250 Kernel | SukiSU-Ultra v${{ env.SUKI_VERSION }} | ${{ env.KERNEL_DATE }}"
          body: |
            ## OnePlus 8 / 8 Pro / 8T / 9R - Custom Kernel
            **SukiSU-Ultra** v${{ env.SUKI_VERSION }} | Branch: `${{ github.event.inputs.sukisu_branch || 'main' }}`
            **KPM**: `${{ github.event.inputs.enable_kpm || 'true' }}` | **LTO**: `${{ github.event.inputs.enable_lto || 'thin' }}`
            **Commit**: `${{ env.KERNEL_COMMIT }}` | **Date**: ${{ env.KERNEL_DATE }} | **Time**: ${{ env.BUILD_MINS }}

            | Item | Value |
            |------|-------|
            | Platform | Snapdragon 865 (SM8250) |
            | Kernel | Linux ${{ env.KERNEL_VERSION }} |
            | Size | ${{ env.ZIP_SIZE }} |
            | SHA256 | `${{ env.ZIP_SHA256 }}` |

            **How to install:** Unlock BL -> Flash in Recovery -> Install SukiSU Manager APK -> Reboot
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
