# ============================================================
#  OnePlus SM8250 (Kona) Kernel Builder
#  SukiSU-Ultra + KPM 集成 | Clang 工具链 | AnyKernel3 打包
#  设备支持：OnePlus 8 / 8 Pro / 8T / 9R
# ============================================================
name: Build Kernel · SM8250 · SukiSU-Ultra

on:
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU-Ultra 分支 (main / susfs-main / builtin)'
        required: false
        default: 'main'
      enable_kpm:
        description: '启用 KPM 支持 (内核模块补丁)'
        required: false
        default: 'true'
        type: boolean
      enable_lto:
        description: 'LTO 优化 (thin / none)'
        required: false
        default: 'thin'
      upload_release:
        description: '编译成功后发布 Release'
        required: false
        default: 'true'
        type: boolean
  push:
    branches: [ udc ]
    paths-ignore:
      - '**.md'
      - 'Documentation/**'

# ── 全局变量 ────────────────────────────────────────────────
env:
  KERNEL_REPO:      "Evolution-XYZ-Devices/kernel_oneplus_sm8250"
  KERNEL_BRANCH:    "udc"
  ARCH:             "arm64"
  # SM8250 (Kona) defconfig 路径
  DEFCONFIG:        "vendor/kona-perf_defconfig"
  OUT_DIR:          "out"
  KERNEL_VERSION:   "4.19"
  ANYKERNEL_REPO:   "osm0sis/AnyKernel3"
  ANYKERNEL_BRANCH: "master"

jobs:
  build:
    name: 🔨 Build SM8250 Kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      # ── 1. 安装依赖 ──────────────────────────────────────
      - name: 📦 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            git curl wget zip unzip \
            bc bison flex libssl-dev libelf-dev \
            python3 python3-pip \
            make gcc g++ \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            libncurses-dev \
            cpio device-tree-compiler \
            lld llvm        # 系统级 ld.lld 备用，防止工具链缺失

      # ── 2. 克隆内核源码 ──────────────────────────────────
      - name: 🐧 克隆内核源码
        run: |
          git clone \
            --depth=1 \
            --branch ${{ env.KERNEL_BRANCH }} \
            https://github.com/${{ env.KERNEL_REPO }}.git \
            kernel_src

          cd kernel_src
          echo "KERNEL_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "KERNEL_DATE=$(date '+%Y%m%d-%H%M')"         >> $GITHUB_ENV
          echo "✅ 内核克隆完成，最新提交: $(git log --oneline -1)"

      # ── 3. 下载 Clang 工具链（含 ld.lld 修复） ──────────
      - name: 🔧 下载 Clang 工具链
        run: |
          mkdir -p toolchain/clang

          # ZyC Clang 19 — 针对 Android 内核优化
          wget -q --show-progress \
            "https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240704-release/Clang-19.0.0git-20240704.tar.gz" \
            -O clang.tar.gz
          tar -xzf clang.tar.gz -C toolchain/clang --strip-components=1
          rm clang.tar.gz

          CLANG_BIN="$(pwd)/toolchain/clang/bin"

          # ── 修复：补全工具链中缺失的 LLVM 工具 ──────────
          for tool in ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip; do
            if [ ! -f "$CLANG_BIN/$tool" ]; then
              SYS=$(which $tool 2>/dev/null || true)
              if [ -n "$SYS" ]; then
                ln -sf "$SYS" "$CLANG_BIN/$tool"
                echo "  🔗 软链接: $tool → $SYS"
              else
                echo "  ⚠️  系统中也未找到 $tool"
              fi
            fi
          done

          # 写入全局 PATH（对所有后续 step 永久生效）
          echo "$CLANG_BIN" >> $GITHUB_PATH
          echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV

          echo "✅ Clang:  $($CLANG_BIN/clang   --version | head -1)"
          echo "✅ ld.lld: $($CLANG_BIN/ld.lld  --version | head -1)"

      # ── 4. 集成 SukiSU-Ultra ─────────────────────────────
      - name: 🔑 集成 SukiSU-Ultra
        working-directory: kernel_src
        run: |
          BRANCH="${{ github.event.inputs.sukisu_branch }}"
          [ -z "$BRANCH" ] && BRANCH="main"

          echo "▶ 正在集成 SukiSU-Ultra (分支: $BRANCH)..."
          curl -LSs \
            "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" \
            | bash -s "$BRANCH"

          # 获取版本号
          SUKI_VER=$(cat KernelSU/kernel/Makefile 2>/dev/null \
            | grep "^KERNELSU_VERSION" | awk '{print $3}' || echo "unknown")
          echo "SUKI_VERSION=$SUKI_VER" >> $GITHUB_ENV
          echo "✅ SukiSU-Ultra 版本: $SUKI_VER"

      # ── 5. 修改 defconfig ────────────────────────────────
      - name: ⚙️ 修改 defconfig
        working-directory: kernel_src
        run: |
          DEFCONFIG_FILE="arch/${{ env.ARCH }}/configs/${{ env.DEFCONFIG }}"

          # 若路径不存在，尝试通用路径
          if [ ! -f "$DEFCONFIG_FILE" ]; then
            echo "⚠️  未找到 $DEFCONFIG_FILE，尝试 kona_defconfig..."
            DEFCONFIG_FILE="arch/${{ env.ARCH }}/configs/kona_defconfig"
          fi
          echo "ACTUAL_DEFCONFIG=$DEFCONFIG_FILE" >> $GITHUB_ENV

          cat >> "$DEFCONFIG_FILE" << 'EOCONF'

          # ── SukiSU-Ultra ────────────────────────────────
          CONFIG_KSU=y

          # kprobe Hook（非 GKI 必须）
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y

          # KALLSYMS（KPM 必须）
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

          # 模块支持
          CONFIG_MODULES=y
          CONFIG_MODULE_UNLOAD=y
          EOCONF

          # KPM 支持（可选）
          if [ "${{ github.event.inputs.enable_kpm }}" = "true" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG_FILE"
            echo "✅ KPM 支持已启用"
          fi

          echo "✅ defconfig 修改完成 ($DEFCONFIG_FILE)"
          echo "── 末尾 20 行 ──"
          tail -20 "$DEFCONFIG_FILE"

      # ── 6. 设置 LTO 模式 ────────────────────────────────
      - name: 🌍 设置编译参数
        run: |
          LTO="${{ github.event.inputs.enable_lto }}"
          [ -z "$LTO" ] && LTO="thin"
          echo "LTO_FLAG=LTO=$LTO" >> $GITHUB_ENV
          echo "✅ LTO 模式: $LTO"

      # ── 7. 生成 .config ──────────────────────────────────
      - name: 📋 生成 .config
        working-directory: kernel_src
        run: |
          # 使用实际 defconfig 路径（去掉 arch/arm64/configs/ 前缀交给 make）
          DEFCONFIG_TARGET=$(basename ${{ env.ACTUAL_DEFCONFIG }})
          DEFCONFIG_DIR=$(dirname ${{ env.ACTUAL_DEFCONFIG }} | sed 's|arch/arm64/configs/||')
          # make 需要相对于 arch/arm64/configs/ 的路径
          MAKE_DEFCONFIG="${DEFCONFIG_DIR}/${DEFCONFIG_TARGET}"
          MAKE_DEFCONFIG=$(echo "$MAKE_DEFCONFIG" | sed 's|^/||')

          echo "▶ 使用 defconfig: $MAKE_DEFCONFIG"

          make O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="${{ env.CLANG_BIN }}/ld.lld" \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            "$MAKE_DEFCONFIG"

          echo "✅ .config 生成完成"

      # ── 8. 编译内核 ──────────────────────────────────────
      - name: 🔨 编译内核
        working-directory: kernel_src
        run: |
          START=$(date +%s)
          echo "▶ 编译线程: $(nproc --all)"

          make O=${{ env.OUT_DIR }} \
            ARCH=${{ env.ARCH }} \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD="${{ env.CLANG_BIN }}/ld.lld" \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            ${{ env.LTO_FLAG }} \
            -j$(nproc --all) 2>&1 | tee ../build.log

          END=$(date +%s)
          MINS=$(( (END - START) / 60 ))
          echo "BUILD_MINS=${MINS}min" >> $GITHUB_ENV

          IMAGE="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image"
          if [ -f "$IMAGE" ]; then
            echo "✅ 编译成功！耗时 ${MINS} 分钟"
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "❌ 编译失败，请下载 build.log 排查"
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            exit 1
          fi

      # ── 9. AnyKernel3 打包 ───────────────────────────────
      - name: 📦 打包 AnyKernel3
        if: env.BUILD_SUCCESS == 'true'
        run: |
          git clone --depth=1 \
            https://github.com/${{ env.ANYKERNEL_REPO }}.git \
            -b ${{ env.ANYKERNEL_BRANCH }} \
            AnyKernel3

          # 复制 Image
          cp kernel_src/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image AnyKernel3/

          # 复制 dtbo（若存在）
          DTBO="kernel_src/${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/dtbo.img"
          [ -f "$DTBO" ] && cp "$DTBO" AnyKernel3/ && echo "✅ dtbo.img 已复制"

          # 生成包名
          KPM_TAG=""
          [ "${{ github.event.inputs.enable_kpm }}" = "true" ] && KPM_TAG="-KPM"
          ZIP="Kernel-SM8250-SukiSU_v${{ env.SUKI_VERSION }}${KPM_TAG}-${{ env.KERNEL_DATE }}-${{ env.KERNEL_COMMIT }}.zip"
          echo "ZIP_NAME=$ZIP" >> $GITHUB_ENV

          cd AnyKernel3
          zip -r9 "../$ZIP" . -x ".git*" -x "*.md" -x "LICENSE"
          cd ..

          SHA256=$(sha256sum "$ZIP" | awk '{print $1}')
          SIZE=$(du -sh "$ZIP" | awk '{print $1}')
          echo "ZIP_SHA256=$SHA256" >> $GITHUB_ENV
          echo "ZIP_SIZE=$SIZE"     >> $GITHUB_ENV
          echo "✅ 打包完成: $ZIP ($SIZE)"

      # ── 10. 上传 Artifact ────────────────────────────────
      - name: ⬆️ 上传 Artifact
        if: env.BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 7

      # ── 11. 上传编译日志（无论成败）────────────────────
      - name: 📄 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ env.KERNEL_DATE }}
          path: build.log
          retention-days: 3

      # ── 12. 发布 GitHub Release ──────────────────────────
      - name: 🚀 发布 GitHub Release
        if: |
          env.BUILD_SUCCESS == 'true' &&
          (github.event.inputs.upload_release == 'true' || github.event_name == 'push')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "SukiSU-${{ env.SUKI_VERSION }}-${{ env.KERNEL_DATE }}"
          name: "🐧 SM8250 Kernel | SukiSU-Ultra v${{ env.SUKI_VERSION }} | ${{ env.KERNEL_DATE }}"
          body: |
            ## 📱 OnePlus 8 / 8 Pro / 8T / 9R — Custom Kernel

            ### ✨ 特性
            - **SukiSU-Ultra** v${{ env.SUKI_VERSION }} 已集成（分支: `${{ github.event.inputs.sukisu_branch || 'main' }}`）
            - **KPM (Kernel Patch Module)** 支持：`${{ github.event.inputs.enable_kpm || 'true' }}`
            - 基于 Evolution-XYZ 内核源码（`udc` 分支）
            - Clang 编译 + LTO `${{ github.event.inputs.enable_lto || 'thin' }}`
            - kprobe 自动 Hook | KALLSYMS 完整符号表

            ### 📋 构建信息
            | 项目 | 内容 |
            |------|------|
            | 芯片平台 | Snapdragon 865 (SM8250 / Kona) |
            | 内核版本 | Linux ${{ env.KERNEL_VERSION }} |
            | 提交 SHA | `${{ env.KERNEL_COMMIT }}` |
            | 构建时间 | ${{ env.KERNEL_DATE }} |
            | 编译耗时 | ${{ env.BUILD_MINS }} |
            | 包体积   | ${{ env.ZIP_SIZE }} |

            ### 🔒 SHA256 校验
            ```
            ${{ env.ZIP_SHA256 }}
            ```

            ### 📖 刷入步骤
            1. 解锁 Bootloader
            2. 进入 Recovery（TWRP / OrangeFox）
            3. 刷入此 zip
            4. 安装 [SukiSU-Ultra Manager APK](https://github.com/SukiSU-Ultra/SukiSU-Ultra/releases)
            5. 重启，享用 Root 🎉

            ### ⚠️ 免责声明
            > 本内核仅供学习研究使用。刷机有风险，操作前请备份数据。
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
